[package]
name = "dynamo-multimodal"
readme = "README.md"
version = "0.1.1"
edition.workspace = true
description = "Shared multimodal input processing, prompt geometry, token accounting, and content identity for LLM inference serving."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "multimodal", "vision", "preprocessing", "inference"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[features]
default = ["parallel"]
# `fetch::MediaFetcher`: a protected http(s)/data: fetcher (SSRF policy, size
# caps, redirect revalidation). The trusted-source `fetch_bytes*` helpers in the
# same module are still stubs.
fetch = ["dep:base64", "dep:ipnet", "dep:reqwest", "dep:tokio", "dep:url"]
# Links rayon; kernels still run inline until `execution::init_pool` arms the
# crate-owned pool at runtime. Opt out (`default-features = false`) to drop
# rayon from the dependency graph and force the inline path at compile time.
parallel = ["dep:rayon"]
# `video_decode`: MP4 / WebM / Matroska demuxing through FFmpeg's libavformat
# (linked: an LGPL-only FFmpeg 9 found through pkg-config, as Dynamo builds it;
# see scripts/build-ffmpeg.sh), probing, frame sampling, and hardware decoding
# through NVDEC, with VP8 / VP9 on the CPU through libvpx when NVDEC cannot.
# NVIDIA's driver libraries and libvpx are loaded at runtime when present.
# Decodes on 64-bit Linux only (32-bit Linux does not build with this feature).
video-decode = ["dep:ffmpeg-sys-next"]

[dependencies]
base64 = { workspace = true, optional = true }
blake3.workspace = true
ffmpeg-sys-next = { workspace = true, optional = true }
gif.workspace = true
image.workspace = true
ipnet = { workspace = true, optional = true }
png.workspace = true
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "time"] }
turbojpeg.workspace = true
url = { workspace = true, optional = true }
xxhash-rust.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
